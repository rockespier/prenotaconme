name: Deploy staging

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment: staging
    env:
      OWNER: ${{ github.repository_owner }}
      # Deploy exactly the commit that passed CI.
      TAG: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push images
        run: |
          owner=$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')
          for app in api web; do
            docker build -f deploy/$app.Dockerfile -t ghcr.io/$owner/prenotaconme-$app:$TAG -t ghcr.io/$owner/prenotaconme-$app:latest .
            docker push --all-tags ghcr.io/$owner/prenotaconme-$app
          done

      - name: Copy compose file
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: deploy/docker-compose.yml
          target: /opt/prenotaconme
          strip_components: 1

      - name: Deploy
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: TAG
          script: |
            cd /opt/prenotaconme
            sed -i "s/^IMAGE_TAG=.*/IMAGE_TAG=$TAG/" .env
            docker compose pull
            docker compose up -d --remove-orphans
            docker image prune -f
