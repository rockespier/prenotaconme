name: Deploy staging

# Builds API + Angular into one package and installs it on the Windows Server (IIS) over SSH.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment: staging
    env:
      # Deploy exactly the commit that passed CI.
      SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SHA }}

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/frontend/prenotaconme-web/package-lock.json

      - name: Build Angular
        working-directory: src/frontend/prenotaconme-web
        run: npm ci && npx ng build

      - name: Publish API (framework-dependent, win-x64) with Angular in wwwroot
        run: |
          dotnet publish src/backend/PrenotaConMe.Api -c Release -r win-x64 --self-contained false \
            -p:OpenApiGenerateDocuments=false -o out
          mkdir -p out/wwwroot
          cp -r src/frontend/prenotaconme-web/dist/prenotaconme-web/browser/. out/wwwroot/
          (cd out && zip -qr ../release.zip .)

      - name: Upload and install
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          HOST: ${{ secrets.VPS_HOST }}
          USER: ${{ secrets.VPS_USER }}
        run: |
          install -m 600 /dev/null key && printf '%s\n' "$SSH_KEY" > key
          SSH_OPTS="-i key -o StrictHostKeyChecking=accept-new -o BatchMode=yes"
          VERSION="$(date -u +%Y%m%d%H%M%S)-${SHA::7}"

          scp $SSH_OPTS release.zip deploy/windows/deploy.ps1 "$USER@$HOST:C:/prenotaconme/incoming/"
          ssh $SSH_OPTS "$USER@$HOST" \
            "powershell -NoProfile -ExecutionPolicy Bypass -File C:\\prenotaconme\\incoming\\deploy.ps1 -Package C:\\prenotaconme\\incoming\\release.zip -Version $VERSION"

          rm -f key

      - name: Smoke test
        run: curl --fail --retry 5 --retry-delay 5 "https://${{ vars.SITE_DOMAIN }}/health"
