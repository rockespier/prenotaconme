name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - run: dotnet restore PrenotaConMe.slnx
      - run: dotnet build PrenotaConMe.slnx --no-restore -c Release

      - name: OpenAPI document is up to date
        run: git diff --exit-code -- src/frontend/prenotaconme-web/openapi

      # Integration tests use Testcontainers (Docker is available on ubuntu runners).
      - run: dotnet test PrenotaConMe.slnx --no-build -c Release

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/frontend/prenotaconme-web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/frontend/prenotaconme-web/package-lock.json

      - run: npm ci

      - name: API client types are up to date
        run: npm run api:generate && git diff --exit-code -- src/app/core/api/schema.d.ts

      - run: npm test
      - run: npx ng build
