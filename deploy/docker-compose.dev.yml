# Local dev dependencies: PostgreSQL + Seq.
#   docker compose -f deploy/docker-compose.dev.yml up -d
# Seq UI: http://localhost:5341
name: prenotaconme-dev

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: prenotaconme
      POSTGRES_USER: prenota
      POSTGRES_PASSWORD: prenota
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prenota -d prenotaconme"]
      interval: 5s
      retries: 10

  seq:
    image: datalust/seq:latest
    environment:
      ACCEPT_EULA: "Y"
      SEQ_FIRSTRUN_NOAUTHENTICATION: "true"
    ports:
      - "5341:80"
    volumes:
      - seqdata:/data

volumes:
  pgdata:
  seqdata:
