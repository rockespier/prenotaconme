# Staging/production on the VPS. PostgreSQL runs natively on the host (not in Docker).
# Usage on the VPS (in /opt/prenotaconme, next to .env):
#   docker compose pull && docker compose up -d
name: prenotaconme

services:
  web:
    image: ghcr.io/${GHCR_OWNER}/prenotaconme-web:${IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

  api:
    image: ghcr.io/${GHCR_OWNER}/prenotaconme-api:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      # Host PostgreSQL reached through the Docker host gateway.
      ConnectionStrings__Database: ${DATABASE_CONNECTION_STRING}
      Database__MigrateOnStartup: "true"
      Serilog__WriteTo__1__Name: Seq
      Serilog__WriteTo__1__Args__serverUrl: http://seq:80
      OpenTelemetry__OtlpEndpoint: http://seq:80/ingest/otlp
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - seq

  seq:
    image: datalust/seq:latest
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      SEQ_FIRSTRUNADMINPASSWORDHASH: ${SEQ_ADMIN_PASSWORD_HASH}
    # Only reachable from the VPS itself; use an SSH tunnel: ssh -L 5341:localhost:5341 <vps>
    ports:
      - "127.0.0.1:5341:80"
    volumes:
      - seqdata:/data

volumes:
  caddy_data:
  caddy_config:
  seqdata:
